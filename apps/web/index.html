<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8ea" />
    <title>Сходка</title>
    <style>html,body{margin:0;min-height:100%;background:#fff8ea;color:#000;font-family:Arial,sans-serif}.startup-screen{position:relative;box-sizing:border-box;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:18px}.startup-screen h1{font-size:38px;letter-spacing:-1.2px;font-weight:900;line-height:1.1;margin:0}.startup-screen p{font-size:14px;line-height:1.6;margin:0;max-width:290px}.startup-screen button{min-height:48px;padding:12px 20px;border:1px solid #292624;border-radius:24px;background:#f45139;color:#000;font:inherit;cursor:pointer}.startup-screen small{font-size:12px}.startup-spinner{width:28px;height:28px;border:3px solid #29262426;border-top-color:#292624;border-radius:50%;animation:startup-spin .9s linear infinite}.startup-hint{opacity:.65;animation:startup-hint 8s step-end}.startup-retry{animation:startup-hint 70s step-end}@keyframes startup-spin{to{transform:rotate(360deg)}}@keyframes startup-hint{from{visibility:hidden}to{visibility:visible}}@media(prefers-reduced-motion:reduce){.startup-spinner{animation:none;border-top-color:#f45139}}.startup-screen .startup-phrase{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:24px;right:24px;max-width:310px;margin:0 auto;font-size:12px;line-height:1.6;opacity:.65;min-height:58px}.startup-screen{padding-bottom:120px}</style>
  </head>
  <body>
    <div id="root"><section class="startup-screen" role="status"><h1>СХОДКА</h1><span class="startup-spinner" aria-hidden="true"></span><p>Загружаем встречи…</p><p class="startup-phrase" aria-live="off">Можно прийти одному. В этом и идея.</p><p class="startup-hint">Первое открытие может занять около минуты.</p></section></div>
    <noscript><p class="startup-screen">Для работы СХОДКИ нужен JavaScript. Откройте приложение через бота в Telegram или MAX.</p></noscript>
    <script src="/startup.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
